[project]
name = "facelock"
version = "0.4.0"
description = "Lock this Mac when my face is not in front of the webcam"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyobjc-framework-Quartz>=10.0",
]

[project.optional-dependencies]
menubar = ["rumps>=0.4"]
dev = ["pytest>=8.0"]

[project.scripts]
facelock = "facelock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["facelock"]

[tool.setuptools.package-data]
facelock = ["icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
